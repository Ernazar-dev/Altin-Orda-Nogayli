# Render Blueprint: backend (Node, bepul) + frontend (statik sayt, bepul). Baza — Neon (Render'dan tashqarida).
# Sirlar bu faylda YO'Q: `sync: false` qiymatlarini Render paneli so'raydi, JWT_SECRET esa Render o'zi tasodifiy yaratadi.
services:
  - type: web
    name: altin-orda-api
    runtime: node
    plan: free
    rootDir: backend
    # NODE_ENV=production bo'lsa npm devDependencies'ni o'tkazib yuboradi (tsc/prisma kerak) — shuning uchun --include=dev.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Har deployda yangi migratsiyalar bazaga avtomatik qo'llanadi (DIRECT_URL orqali), so'ng server ishga tushadi.
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL        # Neon POOLED ulanish ("-pooler" bor, ?sslmode=require&pgbouncer=true&connect_timeout=15)
        sync: false
      - key: DIRECT_URL          # Neon TO'G'RIDAN-TO'G'RI ulanish (pooler'siz), migratsiyalar uchun
        sync: false
      - key: TEACHER_USERNAME
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: TEACHER_NAME
        value: Ustoz
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN         # Frontend manzili: https://altin-orda-web.onrender.com
        sync: false
      - key: MAX_UPLOAD_MB
        value: "5"

  - type: web
    name: altin-orda-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL        # Backend manzili: https://altin-orda-api.onrender.com
        sync: false
    routes:
      # SPA: barcha yo'llar index.html ga (react-router)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # XSS himoyasining asosi: faqat o'z skriptlari. Antd inline stil ishlatgani uchun style-src 'unsafe-inline'.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
