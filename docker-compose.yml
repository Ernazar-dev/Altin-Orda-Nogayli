services:
  db:
    image: postgres:16-alpine
    container_name: altin_orda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: altin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ildiz papkadagi .env faylida berilishi kerak}
      POSTGRES_DB: altin_orda
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
